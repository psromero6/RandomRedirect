name: Remove dead links

on:
  schedule:
    - cron: "17 9 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        run: python3 scripts/check_links.py links.csv

      - name: Commit removals
        run: |
          if git diff --quiet links.csv; then
            echo "All links OK."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Remove dead links"
            git push
          fi
